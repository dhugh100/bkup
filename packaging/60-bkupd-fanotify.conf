# bkupd watches each backup source with recursive fanotify inode marks -- one
# mark per directory in every source tree (see src/daemon/watch.c). The kernel
# default for fs.fanotify.max_user_marks can be too low for large source trees,
# which silently truncates a whole-tree watch. Raise it so coverage is complete.
fs.fanotify.max_user_marks = 1048576
